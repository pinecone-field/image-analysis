services:
  backend:
    image: corypinecone/image-analysis-backend:latest
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - CLIP_MODEL_PATH="openai/clip-vit-base-patch32"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
